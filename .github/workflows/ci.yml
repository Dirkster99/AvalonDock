# The original WPF line: Windows, real WPF, unit tests and the FlaUI UI tests. The LibreWPF line has its
# own workflow (ci-librewpf.yml); see docs/librewpf.md, section 11.
name: CI

on:
  pull_request:
    branches: [master, 'release/**']
  # The LibreWPF work happens on this branch. A push that only touches the LibreWPF line (its
  # projects, the DevFlow suite, its workflows) or documentation cannot change this line's result, so
  # it does not start a second, redundant run next to CI (LibreWPF).
  push:
    branches: [librewpf]
    paths-ignore:
      - '**/*.LibreWPF.csproj'
      - 'source/AvalonDock.LibreWPF.sln'
      - 'source/DevFlowIntegrationTests/**'
      - '.github/workflows/ci-librewpf.yml'
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A newer push supersedes a run that is still going; manual runs are never cancelled by it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'source/**/*.csproj', 'source/**/*.props') }}

      - name: Restore dependencies
        run: dotnet restore source/AvalonDock.sln

      # No --warnaserror on the command line: it overrides every project in the graph, including the
      # six projects in this repo that deliberately opt out with TreatWarningsAsErrors=false. The
      # zero-warnings policy is unaffected: source/Directory.Build.props sets
      # TreatWarningsAsErrors=true for everything that has not opted out.
      - name: Build
        run: dotnet build source/AvalonDock.sln --configuration Release --no-restore

      - name: Test (Unit Tests)
        run: >
          dotnet test source/AvalonDock.sln
          --configuration Release
          --no-restore
          --filter "Category!=FlaUI"
          --logger "trx;LogFilePrefix=unit-test-results"
          --results-directory TestResults
          -m:1

      - name: Test (FlaUI UI Tests, .NET 10)
        run: >
          dotnet test source/AvalonDock.sln
          --configuration Release
          --no-restore
          --filter "Category=FlaUI"
          --framework net10.0-windows
          --logger "trx;LogFilePrefix=flaui-net10-test-results"
          --results-directory TestResults
          -m:1

      - name: Test (FlaUI UI Tests, .NET 11)
        run: >
          dotnet test source/AvalonDock.sln
          --configuration Release
          --no-restore
          --filter "Category=FlaUI"
          --framework net11.0-windows
          --logger "trx;LogFilePrefix=flaui-net11-test-results"
          --results-directory TestResults
          -m:1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14
